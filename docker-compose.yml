services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinica_ramirez}
      POSTGRES_USER: ${POSTGRES_USER:-clinica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: clinica-ramirez-api:0.2.0
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_ISSUER: ${JWT_ISSUER:-clinica_ramirez}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-clinica_ramirez_web}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-CHANGE_ME}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-clinica_ramirez}
      POSTGRES_USER: ${POSTGRES_USER:-clinica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-5173}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: clinica-ramirez-web:0.2.0
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-5000}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
